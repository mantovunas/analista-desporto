name: analista-futebol

on:
  schedule:
    # Horas em UTC (Lisboa no inverno). Várias tentativas porque o GitHub atrasa; o bot só envia 1x por dia.
    # No verão (hora de Lisboa = UTC+1) subtrai 1 hora a cada uma.
    - cron: "17 9 * * *"
    - cron: "47 10 * * *"
    - cron: "17 12 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:       # botão para correr manualmente
    inputs:
      modo:
        description: "analise (mensagem do dia) ou resultados (resumo da noite)"
        default: "analise"
        required: false

permissions:
  contents: write          # permite ao bot guardar o histórico no repositório

concurrency:
  group: analista-futebol
  cancel-in-progress: false

jobs:
  run:
    # O agendamento só corre no repositório principal; na cópia de teste só corre à mão.
    if: github.event_name != 'schedule' || github.repository == 'mantovunas/analista-desporto'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          MODO: ${{ github.event.inputs.modo }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Guardar histórico
        run: |
          mkdir -p historico dados
          git config user.name "analista-bot"
          git config user.email "analista-bot@users.noreply.github.com"
          git add historico dados
          if git diff --cached --quiet; then
            echo "Sem alterações no histórico"
          else
            git commit -m "Atualizar histórico"
            git push
          fi
